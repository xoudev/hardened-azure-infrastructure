version: 2

updates:
  # Providers Terraform (azurerm, random) et fichier .terraform.lock.hcl
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Actions GitHub (épinglées par SHA de commit)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
